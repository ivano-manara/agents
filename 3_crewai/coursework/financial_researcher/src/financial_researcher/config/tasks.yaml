research_task:
  description: >
    Condurre una ricerca approfondita e aggiornata sull'azienda {company}. Concentrarsi su:
    1. Situazione attuale e stato di salute dell'azienda
    2. Andamento storico dell'azienda
    3. Principali sfide e opportunità
    4. Notizie ed eventi recenti
    5. Prospettive future e possibili sviluppi
    IMPORTANTE: le informazioni DEVONO essere aggiornate e pertinenti alla situazione attuale, {current_date}.
    Assicurarsi di organizzare i risultati della ricerca in una struttura ordinata,  con sezioni chiare.
  expected_output: >
    Un documento di ricerca completo, organizzato in sezioni ben strutturate,
    che copra tutti gli aspetti richiesti relativi a {company}. Includere,
    ove pertinenti, fatti specifici, dati numerici ed esempi.
  agent: researcher

analysis_task:
  description: >
    Analizzare i risultati della ricerca e creare un report completo su {company}.
    Il report deve:
    1. Iniziare con un riepilogo esecutivo
    2. Includere tutte le informazioni chiave emerse dalla ricerca
    3. Fornire un'analisi approfondita di tendenze e pattern
    4. Offrire una prospettiva sul mercato relativa all'azienda, specificando che
       questa analisi non deve essere utilizzata per prendere decisioni di trading
    5. Essere strutturato in uno stile professionale e di facile lettura,
       con titoli e sezioni chiaramente identificabili
  expected_output: >
    Un report professionale e accurato su {company}, che presenti i risultati
    della ricerca arricchiti da analisi e approfondimenti. Il report deve essere
    ben strutturato e comprendere un riepilogo esecutivo, le sezioni principali
    e una conclusione.
  agent: analyst
  context:
    - research_task
  output_file: output/report.md